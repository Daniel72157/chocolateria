name: SonarQube Cloud

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: daniel72157
      SONAR_PROJECT_KEY: Daniel72157_chocolateria
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Verificar proyecto existente
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/components/show?component=${SONAR_PROJECT_KEY}")

          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::El token no es valido o no tiene acceso (HTTP ${status}). Revisa el secreto SONAR_TOKEN."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error::No existe el proyecto '${SONAR_PROJECT_KEY}' en Sonar (HTTP ${status}). Se cancela para no crear uno nuevo."
            echo "Claves de proyecto disponibles en la organizacion:"
            curl -s -H "Authorization: Bearer ${SONAR_TOKEN}" \
              "${SONAR_HOST_URL}/api/projects/search?organization=${SONAR_ORGANIZATION}" \
              | jq -r '.components[]?.key' || true
            exit 1
          fi

          echo "Proyecto encontrado: ${SONAR_PROJECT_KEY}"

      - name: Analisis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.exclusions=.github/**,tests/**,**/node_modules/**,dist/**,public/**,supabase/**,coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=src/pages/**,src/components/**,src/hooks/**,src/store/**,src/App.tsx,src/main.tsx,src/lib/api.ts,src/lib/supabase.ts,src/lib/upload.ts,src/lib/visitor.ts,server/routes/**,server/app.ts,server/dev.ts,server/demo/**,server/lib/supabase.ts,server/middleware/requireAdmin.ts,server/middleware/errorHandler.ts,server/middleware/rateLimit.ts,api/**,scripts/**,shared/seed.ts,shared/land.ts,shared/types.ts,*.config.ts
            -Dsonar.qualitygate.wait=true
