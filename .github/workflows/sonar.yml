name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Análisis de código
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Sin el secreto SONAR_TOKEN el análisis se omite (no falla el repositorio).
      - name: Comprobar el token de Sonar
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::Falta el secreto SONAR_TOKEN; se omite el análisis de Sonar."

      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          fetch-depth: 0 # Sonar necesita todo el historial para atribuir el código nuevo

      - uses: SonarSource/sonarqube-scan-action@v5
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Solo si usas un SonarQube instalado en tu servidor (no SonarQube Cloud):
          # SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
